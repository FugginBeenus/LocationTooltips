# Shared across every Minecraft version.
# Per-version values (minecraft_version, yarn_mappings, fabric_api_version,
# modmenu_version, cloth_config_version, java_version, pack_format) live in
# versions/<mc>/gradle.properties.

group=com.fugginbeenus.locationtooltip
version=0.5.2
archives_base_name=locationtooltip
mod_id=locationtooltip

loader_version=0.19.3

org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Acknowledge Stonecutter's Groovy-DSL nag; migrating to Kotlin DSL is a separate job.
dev.kikugie.stonecutter.hard_mode=true

# Loom 1.17 builds the mapped versions; 26.x needs a newer one (see versions/26.*).
loom_version=1.17.14
