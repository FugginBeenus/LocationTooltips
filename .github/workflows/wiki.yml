name: Publish wiki

# The wiki/ folder in this repo is the source of truth. This copies it to the GitHub wiki
# whenever it changes on main, so there is only one place to edit. Editing pages through the
# wiki's own web editor will be overwritten the next time this runs.

on:
  push:
    branches: [main]
    paths: ['wiki/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Copy wiki/ to the GitHub wiki
        run: |
          git clone --quiet \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" \
            /tmp/wiki

          find /tmp/wiki -maxdepth 1 -name '*.md' -delete
          rm -rf /tmp/wiki/images
          mkdir -p /tmp/wiki/images
          cp wiki/*.md /tmp/wiki/
          cp wiki/images/*.png /tmp/wiki/images/ 2>/dev/null || true

          cd /tmp/wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already matches wiki/, nothing to push."
            exit 0
          fi
          git commit --quiet -m "Sync wiki from ${GITHUB_SHA:0:7}"
          git push --quiet
          echo "Wiki updated."
