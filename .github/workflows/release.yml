name: Publish release

# Publishes every supported Minecraft version (1.20.1 and 1.21.1) to Modrinth AND creates a
# GitHub Release when a version tag (vX.Y.Z) is pushed, or on demand via the "Run workflow"
# button (Actions tab). Stonecutter builds each version, so one tag ships both jars.
#
# Setup required once: add a repository secret named MODRINTH_TOKEN
# (Settings -> Secrets and variables -> Actions -> New repository secret) holding a
# Modrinth personal access token. For the Modrinth upload it needs the "Create versions"
# scope; to also auto-set the project environment it needs "Write projects".
#
# Release flow for future versions:
#   1. bump `version=` in gradle.properties
#   2. add changelogs/<version>.md with the release notes
#   3. git commit, then: git tag vX.Y.Z && git push origin vX.Y.Z

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build both versions but skip publishing (test the pipeline)'
        type: boolean
        default: false

permissions:
  contents: write   # needed to create the GitHub Release

env:
  MODRINTH_PROJECT_ID: EEaD8a3s

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Stonecutter runs Gradle on 21; the 1.20.1 build compiles against a 17 toolchain and
      # the 1.21.1 build against 21, so both JDKs must be present. 21 is listed last so it is
      # the default JVM Gradle launches with.
      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Register both JDK toolchains for Gradle
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64" >> ~/.gradle/gradle.properties

      - name: Resolve version and changelog
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          echo "Publishing version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # On a tag push, ensure the tag matches the project version.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match gradle.properties version ${VERSION}. Bump gradle.properties first."
              exit 1
            fi
          fi

          # Use changelogs/<version>.md if present, otherwise a simple default.
          if [ -f "changelogs/${VERSION}.md" ]; then
            {
              echo "CHANGELOG<<__LT_EOF__"
              cat "changelogs/${VERSION}.md"
              echo "__LT_EOF__"
            } >> "$GITHUB_ENV"
          else
            echo "CHANGELOG=Release ${VERSION}" >> "$GITHUB_ENV"
          fi

      # Build every version first, so a compile failure in one stops the release before any
      # upload happens (rather than half-publishing).
      - name: Build every version
        run: ./gradlew chiseledBuild --no-daemon --stacktrace

      - name: Publish every version to Modrinth
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew :1.20.1:modrinth :1.21.1:modrinth --no-daemon --stacktrace

      - name: Set Modrinth project environment (client required, server optional)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        continue-on-error: true   # don't fail the release if the token lacks "Write projects"
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/mr.txt -w '%{http_code}' -X PATCH \
            "https://api.modrinth.com/v2/project/${MODRINTH_PROJECT_ID}" \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"client_side":"required","server_side":"optional"}')
          echo "Modrinth PATCH status: $code"
          if [ "$code" = "204" ]; then
            echo "Environment set: client required, server optional."
          else
            echo "::warning::Could not set environment (HTTP $code). Set it manually on the project page. Response: $(cat /tmp/mr.txt)"
          fi

      - name: Create GitHub Release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Location Tooltip ${{ env.VERSION }}
          body_path: changelogs/${{ env.VERSION }}.md
          files: |
            versions/1.20.1/build/libs/locationtooltip-${{ env.VERSION }}+1.20.1.jar
            versions/1.21.1/build/libs/locationtooltip-${{ env.VERSION }}+1.21.1.jar
          fail_on_unmatched_files: false
