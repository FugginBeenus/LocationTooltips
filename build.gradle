plugins {
    id "java"
    id "fabric-loom" version "1.17.14"
    id "com.modrinth.minotaur" version "2.+"
}

group = findProperty("group") ?: "com.fugginbeenus.locationtooltip"
version = findProperty("version") ?: "0.0.0"

base {
    archivesName = (findProperty("archives_base_name") ?: "locationtooltip").toString()
}

// Per-version: Minecraft is Java 17 through 1.20.4, 21 from 1.20.5, 25 from 26.1.
def javaVersion = Integer.parseInt(property('java_version').toString())
def unobfuscated = Boolean.parseBoolean((findProperty('unobfuscated') ?: 'false').toString())

java {
    toolchain { languageVersion = JavaLanguageVersion.of(javaVersion) }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu
    maven { url = "https://maven.shedaniel.me/" }                // Cloth Config
}

dependencies {
    minecraft "com.mojang:minecraft:${property('minecraft_version')}"
    // Minecraft stopped publishing mappings once it shipped unobfuscated (26.1 on).
    if (!unobfuscated) {
        mappings loom.officialMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:${property('loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_api_version')}"

    modImplementation("com.terraformersmc:modmenu:${property('modmenu_version')}") { transitive = false }
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${property('cloth_config_version')}") {
        exclude group: "net.fabricmc.fabric-api"
    }
}

loom {}

// Mojang renamed ResourceLocation to Identifier in 1.21.11, and did it consistently
// (ResourceLocationArgument, writeResourceLocation, ...). The source tree keeps the older
// name and Stonecutter rewrites the token for the newer versions, which beats putting a
// version switch on all ~80 usages.
stonecutter.replacements {
    string(stonecutter.eval(stonecutter.current.version, ">=1.21.11")) {
        from = "ResourceLocation"
        to = "Identifier"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = javaVersion
}

def mcVersion = property('minecraft_version').toString()
def packFormat = Integer.parseInt(property('pack_format').toString())

tasks.processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_dep", mcVersion
    filesMatching("fabric.mod.json") {
        expand("version": project.version, "minecraft_dep": mcVersion)
    }
    // 1.21 uses singular datapack folders and "id" (not "item") in advancement icons and recipe
    // results. Ingredients still use "item", so only our own result items get rewritten.
    if (packFormat >= 34) {
        filesMatching("data/locationtooltip/advancements/*.json") {
            filter { line -> line.replace('"item":', '"id":') }
        }
        filesMatching("data/locationtooltip/recipes/*.json") {
            filter { line -> line.replace('"item": "locationtooltip:', '"id": "locationtooltip:') }
        }
        eachFile { f ->
            f.path = f.path
                    .replace("data/locationtooltip/advancements/", "data/locationtooltip/advancement/")
                    .replace("data/locationtooltip/recipes/", "data/locationtooltip/recipe/")
        }
        includeEmptyDirs = false
    }
}

// Jars are named locationtooltip-<version>+<minecraft>.jar so per-version builds don't collide.
tasks.remapJar {
    archiveVersion = "${project.version}+${mcVersion}"
}

tasks.remapSourcesJar {
    archiveVersion = "${project.version}+${mcVersion}"
}

modrinth {
    token = findProperty("modrinthToken") ?: System.getenv("MODRINTH_TOKEN")
    projectId = "EEaD8a3s"

    // Each Minecraft version publishes as its own Modrinth version (0.4.0+1.20.1, 0.4.0+1.21.1).
    versionNumber = "${version}+${mcVersion}"
    versionName = "Location Tooltip ${version} for ${mcVersion}"
    versionType = "release"
    uploadFile = tasks.named("remapJar").flatMap { it.archiveFile }
    gameVersions = [mcVersion]
    loaders = ["fabric"]

    def changelogFile = rootProject.file("changelogs/${version}.md")
    changelog = System.getenv("CHANGELOG") ?: (changelogFile.exists() ? changelogFile.text : "Bug fixes and improvements.")

    dependencies {
        required.project "fabric-api"
        optional.project "modmenu"
        optional.project "cloth-config"
        optional.project "waystones"
    }
}

tasks.modrinth {
    dependsOn(tasks.remapJar)
}
