plugins {
    id "java"
    // Per-version: 26.x ships unobfuscated and needs a Loom that can build without mappings.
    id "fabric-loom" version "${loom_version}"
    id "com.modrinth.minotaur" version "2.+"
}

group = findProperty("group") ?: "com.fugginbeenus.locationtooltip"
version = findProperty("version") ?: "0.0.0"

base {
    archivesName = (findProperty("archives_base_name") ?: "locationtooltip").toString()
}

// Per-version: Minecraft is Java 17 through 1.20.4, 21 from 1.20.5, 25 from 26.1.
def javaVersion = Integer.parseInt(property('java_version').toString())
def unobfuscated = Boolean.parseBoolean((findProperty('unobfuscated') ?: 'false').toString())

/**
 * Mappings for the unobfuscated versions. The names in the jar are already the real ones, so
 * this is an empty (identity) mapping — but it has to declare a "named" namespace, or Loom
 * refuses to remap any sources, including Fabric API's.
 */
def emptyMappingsJar() {
    def jar = layout.buildDirectory.file("lt-mappings/identity-mappings.jar").get().asFile
    if (!jar.exists()) {
        jar.parentFile.mkdirs()
        def tiny = new File(jar.parentFile, "mappings.tiny")
        tiny.text = "tiny\t2\t0\tofficial\tintermediary\tnamed\n"
        ant.zip(destfile: jar) {
            zipfileset(file: tiny, fullpath: "mappings/mappings.tiny")
        }
    }
    return jar
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(javaVersion) }
    // The unobfuscated versions map through an empty intermediary, which has no named
    // namespace for Loom to remap sources into.
    if (!unobfuscated) {
        withSourcesJar()
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu
    maven { url = "https://maven.shedaniel.me/" }                // Cloth Config
}

dependencies {
    minecraft "com.mojang:minecraft:${property('minecraft_version')}"
    // Minecraft stopped publishing mappings once it shipped unobfuscated (26.1 on); those
    // versions take the empty intermediary instead, since the jar already has real names.
    if (unobfuscated) {
        mappings files(emptyMappingsJar())
    } else {
        mappings loom.officialMojangMappings()
    }

    // Mod dependencies only need remapping while Minecraft is still obfuscated. On the
    // unobfuscated versions they are already in the right namespace, so they come in as plain
    // dependencies (what the official 26.x template does).
    def mod = unobfuscated ? "implementation" : "modImplementation"

    // The loader always goes through Loom: its POM declares no dependencies, and Loom is what
    // reads the jar to put the loader's own libraries (ASM, Mixin) on the run classpath.
    modImplementation "net.fabricmc:fabric-loader:${property('loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_api_version')}"

    // Both are optional at runtime, so a version we cannot resolve yet just drops out of the
    // build for that Minecraft version rather than blocking it.
    if (findProperty('modmenu_version')) {
        add(mod, "com.terraformersmc:modmenu:${property('modmenu_version')}") { transitive = false }
    }
    if (findProperty('cloth_config_version')) {
        add(mod, "me.shedaniel.cloth:cloth-config-fabric:${property('cloth_config_version')}") {
            exclude group: "net.fabricmc.fabric-api"
        }
    }
}

loom {
    // 26.x ships real names already, so there is no intermediary step to go through.
    if (unobfuscated) {
        noIntermediateMappings()
    }
}

// Mojang renamed ResourceLocation to Identifier in 1.21.11, and did it consistently
// (ResourceLocationArgument, writeResourceLocation, ...). The source tree keeps the older
// name and Stonecutter rewrites the token for the newer versions, which beats putting a
// version switch on all ~80 usages.
// 1.21.11 renamed a lot and replaced the item predicate API with data-driven item models.
def modernItemModels = stonecutter.eval(stonecutter.current.version, ">=1.21.11")
// 26.x swapped the immediate GuiGraphics for a render-state extractor.
def modernGui = stonecutter.eval(stonecutter.current.version, ">=26.1")

stonecutter.replacements {
    def modern = modernItemModels
    [
        "ResourceLocation" : "Identifier",          // and ResourceLocationArgument, writeResourceLocation, ...
        ".location()"      : ".identifier()",       // ResourceKey
        "registryOrThrow"  : "lookupOrThrow",
        "getMinBuildHeight": "getMinY",
        "getMaxBuildHeight": "getMaxY",
        "MobSpawnType"     : "EntitySpawnReason",
        // Fabric moved the world-render API into a .world subpackage and renamed the hook.
        "rendering.v1.WorldRender"          : "rendering.v1.world.WorldRender",
        "WorldRenderEvents.AFTER_TRANSLUCENT": "WorldRenderEvents.END_MAIN",
    ].each { oldName, newName ->
        string(modern) {
            from = oldName
            to = newName
        }
    }

    [
        "GuiGraphics"  : "GuiGraphicsExtractor",
        ".drawString(" : ".text(",
        // Fabric renamed these modules for 26.x.
        "client.keybinding.v1.KeyBindingHelper" : "client.keymapping.v1.KeyMappingHelper",
        "KeyBindingHelper"                      : "KeyMappingHelper",
        "registerKeyBinding"                    : "registerKeyMapping",
        "itemgroup.v1.FabricItemGroup"          : "creativetab.v1.FabricCreativeModeTab",
        "FabricItemGroup"                       : "FabricCreativeModeTab",
        "PayloadTypeRegistry.playS2C()"         : "PayloadTypeRegistry.clientboundPlay()",
        "PayloadTypeRegistry.playC2S()"         : "PayloadTypeRegistry.serverboundPlay()",
        // Vanilla renames.
        ".setScreen("   : ".setScreenAndShow(",
        ".getDayTime()" : ".getOverworldClockTime()",
    ].each { oldName, newName ->
        string(modernGui) {
            from = oldName
            to = newName
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = javaVersion
}

def mcVersion = property('minecraft_version').toString()
// 1.21 is where the datapack folders went singular and item-stack JSON switched to "id".
def modernData = stonecutter.eval(stonecutter.current.version, ">=1.21")

tasks.processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_dep", mcVersion
    inputs.property "modernItemModels", modernItemModels
    inputs.property "modernData", modernData
    filesMatching("fabric.mod.json") {
        expand("version": project.version, "minecraft_dep": mcVersion)
    }
    // Mixins that only apply to some versions are stripped from the config for the rest:
    // the compass needle lost its target once item predicates went data-driven, and the level
    // renderer hook only exists where Fabric has no world-render event.
    def dropMixins = []
    if (modernItemModels) dropMixins << "ModelPredicateRegistryInvoker"
    if (!modernGui) dropMixins << "LevelRendererMixin"
    if (dropMixins) {
        filesMatching("locationtooltip.mixins.json") {
            filter { line -> dropMixins.any { line.contains(it) } ? null : line }
        }
    }
    // 1.21 uses singular datapack folders and "id" (not "item") in advancement icons and recipe
    // results. Ingredients still use "item", so only our own result items get rewritten.
    if (modernData) {
        filesMatching("data/locationtooltip/advancements/*.json") {
            filter { line -> line.replace('"item":', '"id":') }
        }
        filesMatching("data/locationtooltip/recipes/*.json") {
            filter { line -> line.replace('"item": "locationtooltip:', '"id": "locationtooltip:') }
        }
        eachFile { f ->
            f.path = f.path
                    .replace("data/locationtooltip/advancements/", "data/locationtooltip/advancement/")
                    .replace("data/locationtooltip/recipes/", "data/locationtooltip/recipe/")
        }
        includeEmptyDirs = false
    }
}

// Jars are named locationtooltip-<version>+<minecraft>.jar so per-version builds don't collide.
tasks.remapJar {
    archiveVersion = "${project.version}+${mcVersion}"
}

tasks.matching { it.name == "remapSourcesJar" }.configureEach {
    archiveVersion = "${project.version}+${mcVersion}"
}

modrinth {
    token = findProperty("modrinthToken") ?: System.getenv("MODRINTH_TOKEN")
    projectId = "EEaD8a3s"

    // Each Minecraft version publishes as its own Modrinth version (0.4.0+1.20.1, 0.4.0+1.21.1).
    versionNumber = "${version}+${mcVersion}"
    versionName = "Location Tooltip ${version} for ${mcVersion}"
    versionType = "release"
    uploadFile = tasks.named("remapJar").flatMap { it.archiveFile }
    // One build usually covers a whole patch family; game_versions lists the rest.
    gameVersions = (findProperty('game_versions') ?: mcVersion).toString().split(',').collect { it.trim() }
    loaders = ["fabric"]

    def changelogFile = rootProject.file("changelogs/${version}.md")
    changelog = System.getenv("CHANGELOG") ?: (changelogFile.exists() ? changelogFile.text : "Bug fixes and improvements.")

    dependencies {
        required.project "fabric-api"
        optional.project "modmenu"
        optional.project "cloth-config"
        optional.project "waystones"
    }
}

tasks.modrinth {
    dependsOn(tasks.remapJar)
}
