pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url "https://maven.fabricmc.net/" }
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.6'
}

rootProject.name = "locationtooltip"

stonecutter {
    create(getRootProject()) {
        versions "1.20.1", "1.21.1", "1.21.11"
        vcsVersion = "1.20.1"
    }
}
