pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url "https://maven.fabricmc.net/" }
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.7'
}

rootProject.name = "locationtooltip"

stonecutter {
    create(getRootProject()) {
        versions "1.20.1", "1.21.1", "1.21.11", "26.1", "26.2"
        vcsVersion = "1.20.1"
    }
}
